name: Build 1demoapp APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'BUILD_DIAGNOSTICS.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        id: jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        id: android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK API 36.1
        id: sdk
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle 9.3.1
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure CI Firebase placeholder config if missing
        id: firebase_placeholder
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "ci-local-placeholder",
              "storage_bucket": "ci-local-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.auraai.k9x4mp"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "ci-local-web-client-id",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "ci-local-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "ci-local-web-client-id",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "Generated temporary CI placeholder app/google-services.json"
          fi

          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            mkdir -p app/src/main/res/values
            cat > app/src/main/res/values/firebase_applet_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ci-local-db</string>
          </resources>
          EOF
            echo "Generated temporary CI placeholder firebase_applet_config.xml"
          fi

      - name: Generate local debug keystore
        id: keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests and build installable APK
        id: build
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug > build-output.log 2>&1
          result=$?
          tail -n 90 build-output.log
          exit $result

      - name: Upload APK for phone download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 1demoapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Save diagnostic summary to repository
        if: always()
        env:
          JDK_OUTCOME: ${{ steps.jdk.outcome }}
          ANDROID_OUTCOME: ${{ steps.android.outcome }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
          FIREBASE_PLACEHOLDER_OUTCOME: ${{ steps.firebase_placeholder.outcome }}
          KEYSTORE_OUTCOME: ${{ steps.keystore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "# Latest Android build diagnostics"
            echo
            echo "Run: $RUN_URL"
            echo "Source commit: $COMMIT_SHA"
            echo
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| Java setup | $JDK_OUTCOME |"
            echo "| Android setup | $ANDROID_OUTCOME |"
            echo "| Android SDK packages | $SDK_OUTCOME |"
            echo "| Gradle setup | $GRADLE_OUTCOME |"
            echo "| Firebase CI config | $FIREBASE_PLACEHOLDER_OUTCOME |"
            echo "| Debug keystore | $KEYSTORE_OUTCOME |"
            echo "| Android compile | $BUILD_OUTCOME |"
            if [ -f build-output.log ] && [ "$BUILD_OUTCOME" != "success" ]; then
              echo
              echo "## Compiler and build errors"
              echo '~~~'
              (grep -Ei '(^e: |error: |unresolved reference|caused by:|FAILURE:|\* What went wrong:|failed to)' build-output.log | head -n 35 || true) | sed -E 's/nvapi-[A-Za-z0-9_-]+/[REDACTED_NVIDIA_KEY]/g' | cut -c 1-220
              echo '~~~'
              echo
              echo "## Tail of build log"
              echo '~~~'
              tail -n 30 build-output.log | sed -E 's/nvapi-[A-Za-z0-9_-]+/[REDACTED_NVIDIA_KEY]/g' | cut -c 1-220
              echo '~~~'
            fi
          } > BUILD_DIAGNOSTICS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_DIAGNOSTICS.md
          git diff --staged --quiet || git commit -m "ci: record Android build diagnostic [skip ci]"
          git push origin HEAD:main || echo "Diagnostic push blocked; inspect Actions logs"
